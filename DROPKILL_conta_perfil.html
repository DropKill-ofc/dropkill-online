<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1424">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DROPKILL</title>
<style>/* DROPKILL — estilos. Identidade: azul-noite, laranja "drop" e ciano "prisma". */
:root {
  --bg: #0b1424; --bg2: #13233d; --ink: #eaf4ff; --mut: #8fa8c8; --org: #ff7a1a; --org2: #ffb04a; --cy: #44e0ff; --red: #ff4a5a; --grn: #5be07a;
  --u: min(1vw, 1.7vh); /* unidade responsiva */
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink); font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; touch-action: none; overscroll-behavior: none; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
.hidden { display: none !important; }
button { font: inherit; color: inherit; }

/* ---------- telas ---------- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; }
.screen.dim { background: radial-gradient(ellipse at 50% 35%, rgba(19,35,61,.55), rgba(5,10,20,.92)); backdrop-filter: blur(3px); }
.title-screen { background: linear-gradient(180deg, rgba(5,12,28,.15) 0%, rgba(5,12,28,.55) 60%, rgba(5,12,28,.85) 100%); }
.logo { position: relative; font-family: Impact, "Arial Black", "Segoe UI", sans-serif; font-weight: 900; letter-spacing: .04em; font-size: calc(var(--u) * 15); line-height: 1; transform: skewX(-8deg); text-transform: uppercase; filter: drop-shadow(0 .5vmin 0 rgba(0,0,0,.45)) drop-shadow(0 0 3vmin rgba(255,122,26,.35)); animation: logo-in .9s cubic-bezier(.2,1.3,.4,1) both, logo-glow 3.5s ease-in-out 1s infinite; }
.logo .a { background: linear-gradient(180deg, #fff2c8, var(--org2) 45%, var(--org)); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: .25vmin #5a2200; }
.logo .b { background: linear-gradient(180deg, #e8fcff, var(--cy) 50%, #1a8fb8); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: .25vmin #06384a; }
.tagline { margin-top: 1vmin; color: var(--mut); letter-spacing: .5em; font-size: calc(var(--u) * 1.5); text-transform: uppercase; animation: fade-in 1.2s .5s both; }
@keyframes logo-in { from { transform: skewX(-8deg) translateY(-6vmin) scale(1.25); opacity: 0; } to { transform: skewX(-8deg); opacity: 1; } }
@keyframes logo-glow { 50% { filter: drop-shadow(0 .5vmin 0 rgba(0,0,0,.45)) drop-shadow(0 0 5vmin rgba(68,224,255,.5)); } }
@keyframes fade-in { from { opacity: 0; transform: translateY(1vmin); } to { opacity: 1; } }
.menu { display: flex; flex-direction: column; gap: 1.6vmin; margin-top: 5vmin; width: min(78vw, 360px); }
.btn { position: relative; pointer-events: auto; cursor: pointer; border: 0; padding: 1.7vmin 3vmin; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: calc(var(--u) * 2.1); color: #fff; background: linear-gradient(180deg, #2a4a7a, #17294a); border-radius: 1vmin; clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); box-shadow: inset 0 0 0 .25vmin rgba(255,255,255,.12); transition: transform .12s, filter .12s; min-height: 44px; }
.btn:hover, .btn:focus-visible { transform: translateY(-2px) scale(1.03); filter: brightness(1.2); outline: none; }
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(180deg, var(--org2), var(--org) 60%, #c9500a); color: #2a1200; text-shadow: 0 1px 0 rgba(255,255,255,.35); animation: pulse 2.2s ease-in-out infinite; }
.btn.cy { background: linear-gradient(180deg, #6fe9ff, #1fb1d8); color: #052a38; }
.btn.small { font-size: calc(var(--u) * 1.6); padding: 1vmin 2vmin; }
@keyframes pulse { 50% { box-shadow: 0 0 3vmin rgba(255,122,26,.7), inset 0 0 0 .25vmin rgba(255,255,255,.3); } }
.ver { position: absolute; bottom: calc(1vmin + var(--safe-b)); right: calc(2vmin + var(--safe-r)); color: var(--mut); font-size: calc(var(--u) * 1.3); }
.panel { background: linear-gradient(160deg, rgba(23,41,74,.96), rgba(9,18,34,.97)); border: .3vmin solid rgba(68,224,255,.3); border-radius: 1.5vmin; padding: 3vmin 4vmin; width: min(92vw, 640px); max-height: 92vh; overflow: auto; box-shadow: 0 2vmin 6vmin rgba(0,0,0,.6); }
.panel h2 { margin: 0 0 2vmin; letter-spacing: .15em; text-transform: uppercase; color: var(--cy); font-size: calc(var(--u) * 2.4); }
 .account-panel { text-align: center; width: min(92vw, 540px); }
 .account-panel .account-sub { color: var(--mut); line-height: 1.5; font-size: calc(var(--u) * 1.7); margin: 0 0 2.2vmin; }
 .account-panel .account-input { display: block; width: 100%; min-height: 50px; padding: 12px 16px; border: 2px solid rgba(68,224,255,.45); border-radius: 9px; background: rgba(4,12,26,.9); color: #fff; outline: none; font: 800 18px "Segoe UI",system-ui,sans-serif; letter-spacing: .04em; user-select: text; -webkit-user-select: text; touch-action: manipulation; }
 .account-panel .account-input:focus { border-color: var(--org2); box-shadow: 0 0 0 3px rgba(255,176,74,.14); }
 .account-panel .account-note { color: var(--mut); font-size: calc(var(--u) * 1.3); line-height: 1.45; margin-top: 1.5vmin; }
 .account-panel .account-error { min-height: 1.5em; color: #ff8791; font-size: calc(var(--u) * 1.5); margin-top: 1vmin; }
 .account-tag { margin-top: .9vmin; color: var(--cy); font-size: calc(var(--u) * 1.5); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 2vmin; margin: 1.4vmin 0; font-size: calc(var(--u) * 1.8); }
.row label { color: var(--ink); }
.row input[type=range] { width: 45%; accent-color: var(--org); }
.seg { display: flex; gap: .6vmin; }
.seg button { pointer-events: auto; cursor: pointer; border: 0; background: #1c3157; padding: 1vmin 1.6vmin; border-radius: .8vmin; font-weight: 700; font-size: calc(var(--u) * 1.5); min-height: 38px; }
.seg button.on { background: var(--org); color: #2a1200; }
.chk { width: 28px; height: 28px; accent-color: var(--org); }
.hint { color: var(--mut); font-size: calc(var(--u) * 1.4); margin-top: 1vmin; line-height: 1.4; }
.statgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2vmin; margin: 2vmin 0; }
.stat { background: rgba(255,255,255,.06); border-radius: 1vmin; padding: 1.2vmin; text-align: center; }
.stat b { display: block; font-size: calc(var(--u) * 3); color: var(--org2); }
.stat span { color: var(--mut); font-size: calc(var(--u) * 1.2); letter-spacing: .1em; text-transform: uppercase; }

/* lobby */
.lobby { align-items: stretch; justify-content: space-between; flex-direction: row; padding: calc(3vmin + var(--safe-t)) calc(4vmin + var(--safe-r)) calc(3vmin + var(--safe-b)) calc(4vmin + var(--safe-l)); background: linear-gradient(90deg, rgba(5,12,28,.75), rgba(5,12,28,0) 60%); }
.lobby .side { display: flex; flex-direction: column; gap: 1.6vmin; justify-content: center; width: min(46vw, 380px); }
.lobby .mode { background: rgba(255,255,255,.07); border-left: .6vmin solid var(--org); padding: 1.6vmin 2vmin; border-radius: .6vmin; }
.lobby .mode h3 { margin: 0 0 .6vmin; color: var(--org2); letter-spacing: .12em; font-size: calc(var(--u) * 2); }
.lobby .mode p { margin: 0; color: var(--mut); font-size: calc(var(--u) * 1.5); }
.lobby .bottom { display: flex; flex-direction: column; gap: 1.2vmin; }
.lobby .name { font-size: calc(var(--u) * 3); font-weight: 900; letter-spacing: .1em; }

/* carregamento */
.loading { background: radial-gradient(circle at 50% 40%, #16335e, #060d1a); }
.bar { width: min(70vw, 520px); height: 1.6vmin; background: rgba(255,255,255,.1); border-radius: 1vmin; overflow: hidden; margin-top: 3vmin; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--org), var(--cy)); transition: width .2s; }
.tip { margin-top: 2vmin; color: var(--mut); font-size: calc(var(--u) * 1.6); text-align: center; max-width: 80vw; }

/* resultados */
.results h1 { font-family: Impact, "Arial Black", sans-serif; font-size: calc(var(--u) * 9); margin: 0; letter-spacing: .08em; transform: skewX(-8deg); }
.results.win h1 { color: var(--org2); text-shadow: 0 0 3vmin rgba(255,122,26,.7); }
.results.lose h1 { color: var(--red); text-shadow: 0 0 3vmin rgba(255,74,90,.6); }
.results .place { font-size: calc(var(--u) * 3); color: var(--cy); margin: .5vmin 0 2vmin; letter-spacing: .15em; }
.results .btns { display: flex; gap: 2vmin; margin-top: 2vmin; flex-wrap: wrap; justify-content: center; }
.results .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4vmin; min-width: min(80vw, 560px); }

/* rotação */
.rotate { background: #060d1a; z-index: 50; text-align: center; padding: 6vmin; gap: 2vmin; }
.rotate .ph { width: 14vmin; height: 24vmin; border: .8vmin solid var(--cy); border-radius: 2vmin; animation: rot 2.4s ease-in-out infinite; }
@keyframes rot { 0%,20% { transform: rotate(0); } 60%,100% { transform: rotate(-90deg); } }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
.mm { position: absolute; left: calc(1.5vmin + var(--safe-l)); top: calc(1.5vmin + var(--safe-t)); width: min(28vmin, 190px); height: min(28vmin, 190px); border-radius: 50%; border: .5vmin solid rgba(255,255,255,.75); box-shadow: 0 0 2vmin rgba(0,0,0,.5); overflow: hidden; background: #0e2236; pointer-events: auto; }
.mm canvas { width: 100%; height: 100%; display: block; }
.counts { position: absolute; left: calc(1.5vmin + min(28vmin, 190px) + 1.5vmin + var(--safe-l)); top: calc(1.8vmin + var(--safe-t)); display: flex; gap: 1vmin; }
.pill { background: rgba(8,16,30,.7); border: .2vmin solid rgba(255,255,255,.2); border-radius: 2vmin; padding: .6vmin 1.6vmin; font-weight: 800; font-size: calc(var(--u) * 1.9); letter-spacing: .05em; white-space: nowrap; }
.pill small { color: var(--mut); font-size: .6em; letter-spacing: .12em; margin-right: .5vmin; }
.pill.org { color: var(--org2); }
.zonebox { position: absolute; top: calc(1.5vmin + var(--safe-t)); left: 50%; transform: translateX(-50%); text-align: center; }
.zonebox .pill { display: inline-block; }
.zonebox .pill.warn { background: rgba(120,20,30,.8); color: #fff; animation: blink .8s steps(2) infinite; }
@keyframes blink { 50% { opacity: .55; } }
.toast { position: absolute; top: calc(11vmin + var(--safe-t)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: .6vmin; align-items: center; }
.toast div { background: rgba(8,16,30,.8); border-left: .5vmin solid var(--cy); padding: .8vmin 2vmin; border-radius: .6vmin; font-weight: 800; font-size: calc(var(--u) * 1.9); animation: toast 2.8s forwards; white-space: nowrap; }
.toast div.warn { border-color: var(--red); color: #ffd0d4; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-1vmin); } 8%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.feed { position: absolute; right: calc(1.5vmin + var(--safe-r)); top: calc(10vmin + var(--safe-t)); display: flex; flex-direction: column; align-items: flex-end; gap: .5vmin; max-width: 38vw; }
.feed div { background: rgba(8,16,30,.7); padding: .5vmin 1.2vmin; border-radius: .5vmin; font-size: calc(var(--u) * 1.5); animation: feed 5s forwards; border-right: .4vmin solid var(--org); }
.feed div.me { border-color: var(--grn); background: rgba(14,60,30,.75); }
.feed div.you { border-color: var(--red); background: rgba(70,14,20,.75); }
@keyframes feed { 0% { opacity: 0; transform: translateX(3vmin); } 6%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.topbtns { position: absolute; right: calc(1.5vmin + var(--safe-r)); top: calc(1.5vmin + var(--safe-t)); display: flex; gap: 1vmin; pointer-events: auto; }
.ib { width: 6.2vmin; height: 6.2vmin; min-width: 40px; min-height: 40px; border-radius: 50%; border: .25vmin solid rgba(255,255,255,.4); background: rgba(8,16,30,.7); display: grid; place-items: center; font-weight: 900; font-size: calc(var(--u) * 2.2); cursor: pointer; pointer-events: auto; }
.ib:active { transform: scale(.92); }

.cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0; will-change: transform; }
.cross .ring { position: absolute; left: 0; top: 0; width: 4vmin; height: 4vmin; margin: -2vmin 0 0 -2vmin; box-sizing: border-box; border: .26vmin solid rgba(255,255,255,.92); border-radius: 50%; box-shadow: 0 0 .35vmin rgba(0,0,0,.9), inset 0 0 .35vmin rgba(0,0,0,.55); transition: border-color .09s, box-shadow .09s; }
.cross .dot { position: absolute; left: -.26vmin; top: -.26vmin; width: .52vmin; height: .52vmin; border-radius: 50%; background: #fff; box-shadow: 0 0 .3vmin #000; transition: background .09s; }
.cross.lock .ring { border-color: #ff2433; box-shadow: 0 0 1vmin rgba(255,30,50,.95), 0 0 .35vmin #000, inset 0 0 .5vmin rgba(255,30,50,.55); }
.cross.lock .dot { background: #ff2433; }
.hitm { position: absolute; left: 50%; top: 50%; width: 5vmin; height: 5vmin; margin: -2.5vmin 0 0 -2.5vmin; opacity: 0; }
.hitm::before, .hitm::after { content: ""; position: absolute; left: 50%; top: -10%; width: .45vmin; height: 120%; background: #fff; transform: translateX(-50%) rotate(45deg); }
.hitm::after { transform: translateX(-50%) rotate(-45deg); }
.hitm.on { animation: hitm .28s ease-out; }
.hitm.head::before, .hitm.head::after { background: var(--red); }
.hitm.kill::before, .hitm.kill::after { background: var(--red); width: .7vmin; }
.hitm.shield::before, .hitm.shield::after { background: var(--cy); }
@keyframes hitm { 0% { opacity: 1; transform: scale(1.4); } 100% { opacity: 0; transform: scale(.9); } }
.dmgnum { position: absolute; left: 50%; top: 45%; font-weight: 900; font-size: calc(var(--u) * 2.4); color: #fff; text-shadow: 0 0 .6vmin #000, 0 .2vmin 0 #000; animation: dn .9s ease-out forwards; }
.dmgnum.head { color: #ff4a5a; font-size: calc(var(--u) * 3); }
@keyframes dn { 0% { opacity: 1; transform: translate(var(--dx), 0); } 100% { opacity: 0; transform: translate(var(--dx), -7vmin); } }
.prompt { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); background: rgba(8,16,30,.82); border: .25vmin solid var(--org); border-radius: 1vmin; padding: .8vmin 2vmin; font-weight: 800; font-size: calc(var(--u) * 1.9); white-space: nowrap; display: flex; gap: 1vmin; align-items: center; }
.prompt kbd { background: var(--org); color: #2a1200; border-radius: .5vmin; padding: .1vmin .9vmin; font-weight: 900; }
.nearby { position: absolute; display: flex; flex-direction: column; gap: .8vmin; pointer-events: auto; right: calc(30vmin + var(--safe-r)); bottom: calc(46vmin); }
.nearby button { border: 0; background: rgba(8,16,30,.85); border-left: .6vmin solid var(--org); color: #fff; padding: 1vmin 1.6vmin; border-radius: .6vmin; font-weight: 700; font-size: calc(var(--u) * 1.6); text-align: left; min-height: 40px; pointer-events: auto; }
.dirind { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.dirind i { position: absolute; left: -6vmin; top: -22vmin; width: 12vmin; height: 5vmin; background: radial-gradient(ellipse at 50% 100%, rgba(255,40,60,.85), transparent 70%); transform-origin: 50% 22vmin; animation: dir 1.4s forwards; }
@keyframes dir { 0% { opacity: 1; } 100% { opacity: 0; } }
.vig { position: absolute; inset: 0; pointer-events: none; transition: opacity .2s; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(255,0,20,.55) 100%); }
.vig.zone { background: radial-gradient(ellipse at center, transparent 40%, rgba(40,120,255,.55) 100%); }
.scope { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at center, transparent 21vmin, #000 21.3vmin); }
.scope::before, .scope::after { content: ""; position: absolute; background: #000; }
.scope::before { left: 0; right: 0; top: 50%; height: .2vmin; }
.scope::after { top: 0; bottom: 0; left: 50%; width: .2vmin; }

.status { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(1.6vmin + var(--safe-b)); display: flex; flex-direction: column; align-items: center; gap: .8vmin; width: min(46vw, 400px); }
.hpbar { position: relative; width: 100%; height: 2.6vmin; min-height: 14px; background: rgba(8,16,30,.8); border: .25vmin solid rgba(255,255,255,.5); border-radius: 1vmin; overflow: hidden; transform: skewX(-12deg); }
.hpbar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(180deg, #8bf59f, #2fbf55); transition: width .15s; }
.hpbar .fill.low { background: linear-gradient(180deg, #ff8a8a, #e03040); }
.hpbar .ghost { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,.5); transition: width 1s .3s; }
.hpbar .arm { position: absolute; left: 0; bottom: 0; height: 28%; background: #44a8ff; transition: width .15s; }
.hpbar .txt { position: absolute; inset: 0; text-align: center; font-weight: 900; font-size: calc(var(--u) * 1.5); line-height: 2.6vmin; text-shadow: 0 1px 2px #000; transform: skewX(12deg); }
.gear { display: flex; gap: 1vmin; align-items: center; }
.gear .g { background: rgba(8,16,30,.75); border: .2vmin solid rgba(255,255,255,.3); border-radius: .8vmin; padding: .4vmin 1.2vmin; font-weight: 800; font-size: calc(var(--u) * 1.5); }
.gear .g.vest::before { content: "▣ "; color: #7ac0ff; } .gear .g.helm::before { content: "◒ "; color: #9ae0a8; } .gear .g.pk::before { content: "▤ "; color: #e8c07a; }
.wslots { display: flex; gap: 1vmin; pointer-events: auto; }
.ws { min-width: 16vmin; background: rgba(8,16,30,.78); border: .25vmin solid rgba(255,255,255,.3); border-radius: .8vmin; padding: .7vmin 1.4vmin; cursor: pointer; transform: skewX(-8deg); }
.ws.on { border-color: var(--org); background: rgba(60,28,6,.85); }
.ws div { transform: skewX(8deg); }
.ws .n { font-size: calc(var(--u) * 1.3); color: var(--mut); letter-spacing: .1em; }
.ws .a { font-size: calc(var(--u) * 2.2); font-weight: 900; }
.ws .a small { font-size: .6em; color: var(--mut); }
.ws.rl .a { color: var(--org2); }

/* inventário */
.inv { display: grid; grid-template-columns: 1fr 1fr; gap: 2vmin; }
.inv h3 { margin: 0 0 1vmin; color: var(--org2); font-size: calc(var(--u) * 1.7); letter-spacing: .12em; text-transform: uppercase; }
.inv .box { background: rgba(255,255,255,.05); border-radius: 1vmin; padding: 1.4vmin; }
.inv .it { display: flex; justify-content: space-between; align-items: center; gap: 1vmin; padding: .8vmin 0; border-bottom: .15vmin solid rgba(255,255,255,.08); font-size: calc(var(--u) * 1.6); }
.inv .it button { pointer-events: auto; border: 0; background: #24467a; padding: .8vmin 1.4vmin; border-radius: .6vmin; font-weight: 700; min-height: 36px; font-size: calc(var(--u) * 1.4); cursor: pointer; }
.inv .it button.dr { background: #5a2a30; }
.tier1 { color: #fff; } .tier2 { color: #5be07a; } .tier3 { color: #4aa8ff; } .tier4 { color: #b06bff; }

/* ---------- controles de toque ---------- */
#touch { position: absolute; inset: 0; pointer-events: none; touch-action: none; }
#touch .pad { position: absolute; pointer-events: auto; touch-action: none; }
#touch .lookpad { right: 0; top: 14vmin; bottom: 0; width: 56%; }
#touch .movepad { left: 0; top: 30%; bottom: 0; width: 42%; }
.joy { position: absolute; width: 22vmin; height: 22vmin; margin: -11vmin 0 0 -11vmin; border-radius: 50%; border: .5vmin solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); pointer-events: none; display: none; }
.joy.on { display: block; }
.joy i { position: absolute; left: 50%; top: 50%; width: 9vmin; height: 9vmin; margin: -4.5vmin 0 0 -4.5vmin; border-radius: 50%; background: rgba(255,255,255,.45); border: .4vmin solid rgba(255,255,255,.7); }
.joyhint { position: absolute; left: 8vmin; bottom: calc(8vmin + var(--safe-b)); width: 20vmin; height: 20vmin; border-radius: 50%; border: .4vmin dashed rgba(255,255,255,.22); pointer-events: none; }
.tb { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; border: .5vmin solid rgba(255,255,255,.55); background: rgba(10,20,40,.55); display: grid; place-items: center; text-align: center; font-weight: 900; font-size: calc(var(--u) * 1.5); letter-spacing: .04em; color: #fff; text-shadow: 0 1px 2px #000; line-height: 1.05; }
.tb.on { background: rgba(255,122,26,.7); border-color: #fff; }
.tb.fire { width: 21vmin; height: 21vmin; right: calc(4vmin + var(--safe-r)); bottom: calc(4vmin + var(--safe-b)); background: rgba(255,60,40,.5); font-size: calc(var(--u) * 2.2); }

.tb .ct { position: absolute; right: -.5vmin; top: -.5vmin; background: var(--org); color: #2a1200; border-radius: 50%; min-width: 3.4vmin; height: 3.4vmin; display: grid; place-items: center; font-size: calc(var(--u) * 1.4); }

.tb.run { left: calc(32vmin + var(--safe-l)); }

/* =====================================================================

   ===================================================================== */

/* ---------- origem de escala dos elementos personalizáveis ---------- */
#hud .mm, .hclone .mm, #hud .counts, .hclone .counts, #hud .zonebox, .hclone .zonebox,
#hud .toast, .hclone .toast, #hud .alt, .hclone .alt { transform-origin: 0 0; }

/* joystick: tamanho proporcional (o knob é calculado em px, então não usamos scale) */
.joy { width: calc(24vmin * var(--hs, 1)); height: calc(24vmin * var(--hs, 1)); }
.joy i { width: calc(10vmin * var(--hs, 1)); height: calc(10vmin * var(--hs, 1)); margin: calc(-5vmin * var(--hs, 1)) 0 0 calc(-5vmin * var(--hs, 1)); }

/* ---------- mira personalizável ---------- */
.cross { --xc: var(--xu, #fff); }

.cross .ring { border-color: var(--xc); }

.cross .ring::before, .cross .ring::after { content: ""; position: absolute; opacity: 0; pointer-events: none; }
.cross .ring::before { left: 0; right: 0; top: 50%; height: .3vmin; margin-top: -.15vmin; background: linear-gradient(90deg, var(--xc) 0 30%, transparent 30% 70%, var(--xc) 70% 100%); }
.cross .ring::after { top: 0; bottom: 0; left: 50%; width: .3vmin; margin-left: -.15vmin; background: linear-gradient(180deg, var(--xc) 0 30%, transparent 30% 70%, var(--xc) 70% 100%); }
.cross[data-xs="ring"] .dot, .cross[data-xs="cross"] .dot { display: none; }
.cross[data-xs="dot"] .ring { border-color: transparent; box-shadow: none; }
.cross[data-xs="dot"] .dot { left: -.5vmin; top: -.5vmin; width: 1vmin; height: 1vmin; }
.cross[data-xs="cross"] .ring, .cross[data-xs="crossdot"] .ring { border-color: transparent; box-shadow: none; filter: drop-shadow(0 0 .25vmin rgba(0,0,0,.95)); }
.cross[data-xs="cross"] .ring::before, .cross[data-xs="cross"] .ring::after,
.cross[data-xs="crossdot"] .ring::before, .cross[data-xs="crossdot"] .ring::after { opacity: 1; }

.screen.hedit { background: radial-gradient(ellipse at 28% 18%, #16294a, #060c18 75%); z-index: 30; align-items: stretch; justify-content: flex-start; overflow: hidden; --he-f: max(12px, calc(var(--u) * 1.3)); font-size: var(--he-f); }

.he-scene { position: absolute; inset: 0; background:
  radial-gradient(ellipse at 50% 100%, rgba(30,50,20,.9), transparent 55%),
  linear-gradient(180deg, #4f86bd 0%, #9cc4e4 46%, #6c8f55 47%, #3f5a34 62%, #2c4125 100%); }

.he-scene::before { left: 50%; top: 0; bottom: 0; width: 2px; } .he-scene::after { top: 50%; left: 0; right: 0; height: 2px; }

.he-item { outline: 3px dashed rgba(255,255,255,.5); outline-offset: 3px; }

.he-item.he-off { opacity: .28 !important; outline-style: dotted; }
.he-moff { display: none !important; }
.cross.he-item, .cross.he-item.he-sel { outline: none; box-shadow: none; }
.cross.he-item .ring { outline: 3px dashed rgba(255,255,255,.5); outline-offset: 3px; background: rgba(255,255,255,.06); }
.cross.he-sel .ring { outline: 4px solid var(--org2); }
.hclone .he-st, .hclone .toast div, .hclone .feed div { animation: none !important; opacity: 1 !important; transform: none !important; }
.hclone .jumpcall.he-jc { top: 30%; }
.hclone .mm.he-item { overflow: hidden; }

.he-panel { position: absolute; display: flex; flex-direction: column; gap: 8px; padding: 12px; overflow: auto; touch-action: pan-y;
  background: linear-gradient(160deg, rgba(23,41,74,.97), rgba(9,18,34,.98)); border: 2px solid rgba(68,224,255,.3); border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }

.he-state.dirty { color: var(--org2); } .he-state.ok { color: var(--grn); animation: he-ok .5s ease-out; }

.he-chip:active { transform: scale(.94); }

.he-card { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); }

.he-row input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--org); }

.he-actions .btn { flex: 1 1 auto; }

.he-modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(2,6,14,.7); z-index: 5; backdrop-filter: blur(2px); }
.he-mcard { display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; padding: 18px; width: min(90vw, 420px); border-radius: 14px; background: linear-gradient(160deg, #1b3157, #0b1628); border: 2px solid rgba(255,176,74,.5); animation: he-pop .3s cubic-bezier(.2,1.3,.4,1); }

/* =====================================================================
   v7 — animações de interface
   ===================================================================== */
@keyframes scr-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes panel-in { from { opacity: 0; transform: translateY(3vmin) scale(.95); } to { opacity: 1; transform: none; } }
@keyframes btn-in { from { opacity: 0; transform: translateX(-5vmin) skewX(-8deg); } to { opacity: 1; transform: none; } }
@keyframes pop-up { from { opacity: 0; transform: translateY(2.4vmin) scale(.8); } to { opacity: 1; transform: none; } }
.screen:not(.hidden) { animation: scr-in .32s ease-out backwards; }
.screen:not(.hidden) > .panel { animation: panel-in .45s cubic-bezier(.2,1.15,.3,1) backwards; }
.menu .btn { animation: btn-in .5s cubic-bezier(.2,1.1,.3,1) backwards; }
.menu .btn:nth-child(1) { animation-delay: .12s; } .menu .btn:nth-child(2) { animation-delay: .19s; }
.menu .btn:nth-child(3) { animation-delay: .26s; } .menu .btn:nth-child(4) { animation-delay: .33s; }
.menu .btn:nth-child(5) { animation-delay: .4s; }
.menu .btn.primary { animation: btn-in .5s cubic-bezier(.2,1.1,.3,1) .1s backwards, pulse 2.2s ease-in-out .7s infinite; }
.btn { transition: transform .15s cubic-bezier(.2,1.3,.4,1), filter .15s, box-shadow .2s; overflow: hidden; }
.btn::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(100deg, transparent 32%, rgba(255,255,255,.38) 50%, transparent 68%); transform: translateX(-130%); }
.btn:hover::after, .btn:focus-visible::after { transform: translateX(130%); transition: transform .65s ease; }
.seg button { transition: background .15s, color .15s, transform .12s; }
.seg button:active { transform: scale(.93); }
.row input[type=range], .row input[type=checkbox] { transition: filter .15s; }
.stat { animation: pop-up .4s cubic-bezier(.2,1.3,.4,1) backwards; }
.statgrid .stat:nth-child(1) { animation-delay: .08s; } .statgrid .stat:nth-child(2) { animation-delay: .14s; }
.statgrid .stat:nth-child(3) { animation-delay: .2s; } .statgrid .stat:nth-child(4) { animation-delay: .26s; }
.statgrid .stat:nth-child(n+5) { animation-delay: .32s; }
@keyframes slam { 0% { opacity: 0; transform: skewX(-8deg) scale(2.4); } 55% { opacity: 1; transform: skewX(-8deg) scale(.94); } 100% { opacity: 1; transform: skewX(-8deg) scale(1); } }
.results:not(.hidden) h1 { animation: slam .65s cubic-bezier(.2,1.2,.4,1) .1s backwards; }
.results:not(.hidden) .place { animation: fade-in .6s ease-out .45s backwards; }
.results:not(.hidden) .grid > * { animation: pop-up .45s cubic-bezier(.2,1.3,.4,1) backwards; }
.results .grid > *:nth-child(1) { animation-delay: .5s; } .results .grid > *:nth-child(2) { animation-delay: .58s; } .results .grid > *:nth-child(3) { animation-delay: .66s; }
.results .grid > *:nth-child(4) { animation-delay: .74s; } .results .grid > *:nth-child(5) { animation-delay: .82s; } .results .grid > *:nth-child(n+6) { animation-delay: .9s; }
.bar i { position: relative; overflow: hidden; }
.bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.55) 50%, transparent 80%); transform: translateX(-100%); animation: bar-shine 1.1s linear infinite; }
@keyframes bar-shine { to { transform: translateX(100%); } }

/* ---------- HUD ---------- */
@keyframes toast { 0% { opacity: 0; transform: translateY(-2.6vmin) scale(.9); } 8% { opacity: 1; transform: translateY(.5vmin) scale(1.04); } 13%, 82% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-1.2vmin); } }
@keyframes feed { 0% { opacity: 0; transform: translateX(6vmin) scale(.92); } 5% { opacity: 1; transform: translateX(-.7vmin); } 9%, 86% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateX(2vmin); } }
@keyframes feed-me { 0% { opacity: 0; transform: translateX(6vmin) scale(.92); } 5% { opacity: 1; transform: translateX(-.7vmin); box-shadow: 0 0 2.4vmin rgba(91,224,122,.95); } 16% { box-shadow: 0 0 .6vmin rgba(91,224,122,.35); } 22%, 86% { opacity: 1; transform: none; box-shadow: none; } 100% { opacity: 0; transform: translateX(2vmin); } }
.feed div.me { animation: feed-me 5s forwards; }
@keyframes hitm { 0% { opacity: 1; transform: scale(1.8); } 35% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.85); } }

.hitm.on { animation: hitm .3s cubic-bezier(.2,.9,.3,1); }
.hitm.kill.on { animation: hitm-kill .6s cubic-bezier(.2,.9,.3,1); }
@keyframes dn { 0% { opacity: 0; transform: translate(var(--dx), 1vmin) scale(.5); } 12% { opacity: 1; transform: translate(var(--dx), -1.2vmin) scale(1.4); } 28% { opacity: 1; transform: translate(var(--dx), -2.4vmin) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), -9vmin) scale(.85); } }
@keyframes dn-head { 0% { opacity: 0; transform: translate(var(--dx), 1vmin) scale(.5) rotate(-8deg); } 10% { opacity: 1; transform: translate(var(--dx), -1.6vmin) scale(1.7) rotate(5deg); } 24% { opacity: 1; transform: translate(var(--dx), -2.8vmin) scale(1.15) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), -10vmin) scale(.9); } }
.dmgnum { animation: dn .95s cubic-bezier(.2,.8,.3,1) forwards; }
.dmgnum.head { animation: dn-head 1.05s cubic-bezier(.2,.8,.3,1) forwards; }
@keyframes dir { 0% { opacity: 1; transform: scale(1.12); } 100% { opacity: 0; transform: scale(.96); } }
@keyframes prompt-in { from { opacity: 0; transform: translateX(-50%) translateY(1.4vmin) scale(.9); } to { opacity: 1; transform: translateX(-50%); } }
.prompt:not(.hidden) { animation: prompt-in .22s cubic-bezier(.2,1.4,.4,1) backwards; }
@keyframes jc-in { from { opacity: 0; transform: translateX(-50%) translateY(-2vmin) scale(.9); } to { opacity: 1; transform: translateX(-50%); } }
@keyframes jc-pulse { 50% { opacity: .78; letter-spacing: .13em; } }
.jumpcall:not(.hidden):not(.he-jc) { animation: jc-in .45s cubic-bezier(.2,1.2,.4,1) backwards, jc-pulse 1.8s ease-in-out .5s infinite; }
.pill { transition: border-color .2s, background .2s; }
.hpbar { transition: border-color .2s, box-shadow .2s; }
.hpbar.crit { animation: hp-crit .9s ease-in-out infinite; }
@keyframes hp-crit { 50% { box-shadow: 0 0 2.2vmin rgba(255,40,60,.85); border-color: #ff6070; } }
.hpbar .fill.low { animation: hp-low 1s ease-in-out infinite; }
@keyframes hp-low { 50% { filter: brightness(1.35); } }
.ws { transition: transform .18s cubic-bezier(.2,1.4,.4,1), border-color .15s, background .15s, box-shadow .2s; }
.ws.on { transform: skewX(-8deg) scale(1.07); box-shadow: 0 0 1.6vmin rgba(255,122,26,.4); }
.ws.rl { animation: rl-pulse .7s ease-in-out infinite; }
@keyframes rl-pulse { 50% { box-shadow: 0 0 1.8vmin rgba(255,176,74,.8); } }
.tb { transition: background .12s, border-color .12s, box-shadow .15s; }
.tb.on { box-shadow: 0 0 2.4vmin rgba(255,122,26,.6); }
.ib { transition: transform .12s, background .15s; }

/* linhas de velocidade na queda livre */
.speedfx { position: absolute; inset: -25%; pointer-events: none; opacity: 0; transition: opacity .5s; overflow: hidden; }
.speedfx::before, .speedfx::after { content: ""; position: absolute; inset: 0; -webkit-mask: radial-gradient(circle at 50% 50%, transparent 30%, #000 72%); mask: radial-gradient(circle at 50% 50%, transparent 30%, #000 72%); will-change: transform, opacity; }
.speedfx::before { background: repeating-conic-gradient(from 3deg at 50% 50%, transparent 0 7deg, rgba(255,255,255,.6) 7.3deg 8deg, transparent 8.2deg 15deg); animation: speed-a 1s linear infinite; }
.speedfx::after { background: repeating-conic-gradient(from 11deg at 50% 50%, transparent 0 11deg, rgba(40,90,150,.3) 11.3deg 11.9deg, transparent 12deg 23deg); animation: speed-a 1.55s linear .4s infinite; }
.speedfx.on { opacity: .9; }
@keyframes speed-a { 0% { transform: scale(.82); opacity: 0; } 20% { opacity: 1; } 100% { transform: scale(1.45); opacity: 0; } }

/* ---------- animações reduzidas (opção em Configurações) ---------- */
body.anim-reduced .screen:not(.hidden), body.anim-reduced .screen:not(.hidden) > .panel, body.anim-reduced .menu .btn,
body.anim-reduced .stat, body.anim-reduced .results:not(.hidden) h1, body.anim-reduced .results:not(.hidden) .place,
body.anim-reduced .results .grid > *, body.anim-reduced .bar i::after, body.anim-reduced .speedfx::before, body.anim-reduced .speedfx::after,
body.anim-reduced .jumpcall, body.anim-reduced .prompt { animation: none !important; }
body.anim-reduced .menu .btn.primary { animation: pulse 2.2s ease-in-out infinite !important; }
body.anim-reduced .btn::after { display: none; }
body.anim-reduced .speedfx { display: none; }

.tb.jumpbig { font-size: calc(var(--u) * 2.1); letter-spacing: .02em; }
/* editor em telas baixas (celular na horizontal) */
@media (max-height: 520px) {
  .screen.hedit { --he-f: 12px; }
  .he-panel { padding: 8px; gap: 6px; }
  .he-hint { display: none; }
  .he-head h2 { font-size: 14px; }
  .he-actions { order: 9; } .he-modes { order: 1; } .he-card { order: 2; padding: 8px; gap: 6px; } .he-chips { order: 3; }
  .he-modes button { min-height: 30px; padding: 4px 8px; font-size: 11px; }
  .he-chip { min-height: 28px; padding: 3px 8px; font-size: 11px; }
  .he-row input[type=range] { height: 22px; }
  .he-actions { flex-wrap: nowrap; gap: 5px; padding: 6px 8px; bottom: -8px; margin: 0 -8px -8px; }
  .he-actions .btn { padding: 8px 4px; font-size: 10px; letter-spacing: .03em; white-space: nowrap; }
  .he-card .btn { padding: 6px 8px; font-size: 10px; }
}

/* =====================================================================
   v8 — medidor de conexão (ping) + saída automática
   ===================================================================== */
#hud .pingbox, .hclone .pingbox { transform-origin: 50% 0; }
.pingbox { position: absolute; top: calc(7.4vmin + var(--safe-t)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: .8vmin;
  background: rgba(8,16,30,.72); border: .2vmin solid rgba(255,255,255,.2); border-radius: 2vmin; padding: .3vmin 1.3vmin;
  font-weight: 900; font-size: calc(var(--u) * 1.5); letter-spacing: .04em; white-space: nowrap; color: var(--pc, #7CFF6B); transition: color .3s; }
.pingbox .pv { min-width: 1.9em; text-align: right; font-variant-numeric: tabular-nums; }
.pingbox small { color: var(--mut); font-size: .65em; letter-spacing: .1em; }
.pingbox .pbars { display: flex; align-items: flex-end; gap: .3vmin; height: 1.9vmin; }
.pingbox .pbars i { display: block; width: .55vmin; background: rgba(255,255,255,.22); border-radius: .15vmin; transition: background .3s; }
.pingbox .pbars i:nth-child(1) { height: 28%; } .pingbox .pbars i:nth-child(2) { height: 52%; }
.pingbox .pbars i:nth-child(3) { height: 76%; } .pingbox .pbars i:nth-child(4) { height: 100%; }
.pingbox .pbars i.on { background: var(--pc, #7CFF6B); }
.pingbox.crit { border-color: var(--pc); background: rgba(70,10,18,.82); animation: pingblink .8s steps(2) infinite; }
@keyframes pingblink { 50% { opacity: .45; } }
.netwarn { position: absolute; top: calc(19vmin + var(--safe-t)); left: 50%; transform: translateX(-50%); text-align: center; background: rgba(110,14,26,.9);
  border: .4vmin solid #ff4b5c; border-radius: 1vmin; padding: 1vmin 2.4vmin; font-weight: 900; letter-spacing: .08em; font-size: calc(var(--u) * 2); color: #fff; white-space: nowrap;
  animation: nwpulse 1s ease-in-out infinite; }
.netwarn small { display: block; font-size: .62em; letter-spacing: .04em; font-weight: 700; color: #ffd0d4; margin-top: .3vmin; }
.netwarn b { color: #fff; font-size: 1.25em; }
@keyframes nwpulse { 50% { box-shadow: 0 0 3vmin rgba(255,60,80,.6); } }
.hclone .pingbox.crit, .hclone .netwarn { animation: none !important; }
body.anim-reduced .pingbox.crit, body.anim-reduced .netwarn { animation: none !important; }
.netnotice { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; background: rgba(3,8,18,.62); padding: 16px; }
.netnotice .nn-card { max-width: min(92vw, 420px); background: rgba(10,18,34,.96); border: 2px solid #ff4b5c; border-radius: 12px; padding: 20px 22px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.netnotice .nn-ic { width: 38px; height: 38px; line-height: 38px; margin: 0 auto 8px; border-radius: 50%; background: #ff4b5c; color: #fff; font-weight: 900; font-size: 22px; }
.netnotice h3 { margin: 0 0 6px; font-size: 20px; letter-spacing: .06em; }
.netnotice p { margin: 0 0 14px; color: var(--mut, #9fb0c8); font-size: 14px; line-height: 1.4; }

/* =====================================================================
   v9 — granadas (botão touch + chip) e Backjump
   ===================================================================== */
.tb.gren { width: 10vmin; height: 10vmin; right: calc(31vmin + var(--safe-r)); bottom: calc(42vmin + var(--safe-b)); border-color: #9cff5a; font-size: calc(var(--u) * 1.15); line-height: 1.05; padding: 0 .4vmin; text-align: center; }
.tb.gren .ct { position: absolute; top: -.6vmin; right: -.6vmin; background: #9cff5a; color: #10240a; border-radius: 50%; min-width: 3.4vmin; height: 3.4vmin; display: grid; place-items: center; font-size: calc(var(--u) * 1.4); }
.tb.gren.on, .tb.gren.charging { background: rgba(156,255,90,.45); transform: scale(1.1); }
#hud .gear .g#gG { color: #b8ff80; }
#hud .gear { flex-wrap: nowrap; gap: .5vmin; }
#hud .gear .g { white-space: nowrap; padding-left: 1vmin; padding-right: 1vmin; }
#hud .gear .g#gG { background-image: linear-gradient(90deg, rgba(156,255,90,.4) var(--gp,0%), transparent var(--gp,0%)); }

/* ===== v9: mira em 1a pessoa (ADS) ===== */
.adsr{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;opacity:0;transition:opacity .09s;z-index:3}
.adsr.on{opacity:1}
.adsr i{position:absolute;display:block;border-radius:50%;transform:translate(-50%,-50%)}
.adsr.dot .d{width:.62vmin;height:.62vmin;background:#ff2e2e;box-shadow:0 0 .8vmin .25vmin rgba(255,40,40,.85)}
.adsr.dot .r{width:4.2vmin;height:4.2vmin;border:.2vmin solid rgba(255,60,60,.75);box-shadow:0 0 1vmin rgba(255,40,40,.5)}
.adsr.iron .d{width:.34vmin;height:.34vmin;background:rgba(255,255,255,.7)}
.adsr.iron .r{display:none}
</style>

/* ===== DKMusic: trilha procedural (cordas, metais, percussão) — militar/cinematográfica, sem eletrônica ===== */
var DKMusic=(()=>{
const M={cur:null,kind:null,bus:null,rev:null,ir:null,intensity:0,boss:false,landed:false,started:false};
const mtof=n=>440*Math.pow(2,(n-69)/12);
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- infraestrutura de áudio ---------- */
function ensure(au){
  const c=au.ctx;
  if(M.bus&&M.bus.context===c)return true;
  M.bus=c.createGain();M.bus.gain.value=0;
  /* reverb gerado (cauda de ~3 s) — dá a sensação de sala/vale grande */
  const len=Math.floor(c.sampleRate*3),ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++){const t=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-t,2.6)*(t<.02?t/.02:1)}}
  M.rev=c.createConvolver();M.rev.buffer=ir;
  M.revG=c.createGain();M.revG.gain.value=.38;
  M.dry=c.createGain();M.dry.gain.value=1;
  M.bus.connect(M.dry);M.bus.connect(M.rev);M.rev.connect(M.revG);
  const out=au.master||c.destination;M.dry.connect(out);M.revG.connect(out);
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;M.noise=nb;
  return true;
}
function volTarget(au){return au.muted?0:.5*Math.min(1,au.volume==null?.8:au.volume)}

/* ---------- vozes ---------- */
function strings(c,dest,t,dur,notes,vol,cut=1300,atk=.9){
  const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=cut;f.Q.value=.4;
  const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+atk);g.gain.setValueAtTime(vol,t+Math.max(atk,dur-1.1));g.gain.linearRampToValueAtTime(0,t+dur+.5);
  f.connect(g);g.connect(dest);
  for(const n of notes)for(const de of[-8,0,8]){const o=c.createOscillator();o.type="sawtooth";o.frequency.value=mtof(n);o.detune.value=de+rnd(-3,3);o.connect(f);o.start(t);o.stop(t+dur+.6)}
}
function pluck(c,dest,t,n,vol,len=.22,cut=2200){          /* cordas staccato (ostinato) */
  const f=c.createBiquadFilter();f.type="lowpass";f.frequency.setValueAtTime(cut,t);f.frequency.exponentialRampToValueAtTime(500,t+len);
  const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+len);
  f.connect(g);g.connect(dest);
  for(const de of[-6,6]){const o=c.createOscillator();o.type="sawtooth";o.frequency.value=mtof(n);o.detune.value=de;o.connect(f);o.start(t);o.stop(t+len+.05)}
}
function horn(c,dest,t,dur,n,vol,open=1700){
  const f=c.createBiquadFilter();f.type="lowpass";f.Q.value=.8;
  f.frequency.setValueAtTime(260,t);f.frequency.linearRampToValueAtTime(open,t+Math.min(.5,dur*.5));f.frequency.linearRampToValueAtTime(700,t+dur);
  const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.18);g.gain.setValueAtTime(vol,t+Math.max(.2,dur-.35));g.gain.linearRampToValueAtTime(0,t+dur+.25);
  f.connect(g);g.connect(dest);
  for(const de of[-5,5]){const o=c.createOscillator();o.type="sawtooth";o.frequency.value=mtof(n);o.detune.value=de;o.connect(f);o.start(t);o.stop(t+dur+.3)}
  const o2=c.createOscillator();o2.type="square";o2.frequency.value=mtof(n-12);const g2=c.createGain();g2.gain.value=.35;o2.connect(g2);g2.connect(f);o2.start(t);o2.stop(t+dur+.3);
}
function cello(c,dest,t,dur,n,vol){
  const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=520;
  const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.7);g.gain.setValueAtTime(vol,t+dur-.8);g.gain.linearRampToValueAtTime(0,t+dur+.4);
  f.connect(g);g.connect(dest);
  for(const de of[-4,4]){const o=c.createOscillator();o.type="sawtooth";o.frequency.value=mtof(n);o.detune.value=de;o.connect(f);o.start(t);o.stop(t+dur+.5)}

function timp(c,dest,t,n,vol){
  const o=c.createOscillator();o.type="sine";const f=mtof(n);o.frequency.setValueAtTime(f*1.5,t);o.frequency.exponentialRampToValueAtTime(f,t+.12);o.frequency.exponentialRampToValueAtTime(f*.82,t+.9);
  const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.001,t+1.1);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+1.2);

function snare(c,dest,t,vol,ghost){
  const s=c.createBufferSource();s.buffer=M.noise;const bf=c.createBiquadFilter();bf.type="bandpass";bf.frequency.value=ghost?2600:2100;bf.Q.value=.7;
  const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.002);g.gain.exponentialRampToValueAtTime(.001,t+(ghost?.06:.16));
  s.connect(bf);bf.connect(g);g.connect(dest);s.start(t,rnd(0,.6),.2);
  if(!ghost){const o=c.createOscillator();o.type="triangle";o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(150,t+.08);const og=c.createGain();og.gain.setValueAtTime(vol*.5,t);og.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(og);og.connect(dest);o.start(t);o.stop(t+.12)}
}
function swell(c,dest,t,dur,vol,hp=4200){                 /* prato / crescendo */
  const s=c.createBufferSource();s.buffer=M.noise;s.loop=true;const bf=c.createBiquadFilter();bf.type="highpass";bf.frequency.value=hp;
  const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.exponentialRampToValueAtTime(vol,t+dur);g.gain.exponentialRampToValueAtTime(.001,t+dur+1.4);
  s.connect(bf);bf.connect(g);g.connect(dest);s.start(t);s.stop(t+dur+1.5);

function drone(c,dest,t,dur,n,vol,cut=240){
  const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=cut;
  const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+1.6);g.gain.setValueAtTime(vol,t+dur-1.4);g.gain.linearRampToValueAtTime(0,t+dur+.6);
  f.connect(g);g.connect(dest);
  for(const de of[-6,0,6]){const o=c.createOscillator();o.type="sawtooth";o.frequency.value=mtof(n);o.detune.value=de;o.connect(f);o.start(t);o.stop(t+dur+.7)}

/* ---------- harmonia (ré menor) ---------- */
const CH={
  Dm:{r:38,n:[50,53,57,62]},Bb:{r:34,n:[46,50,53,58]},Gm:{r:43,n:[55,58,62,67]},A:{r:33,n:[45,49,52,57]},
  F:{r:41,n:[53,57,60,65]},C:{r:36,n:[48,52,55,60]},Em:{r:40,n:[52,55,59,64]}
};
const PROG_LOBBY=["Dm","Bb","Gm","A"];
const PROG_PLANE=["Dm","Bb","F","C","Dm","Bb","Gm","A"];
const PROG_ZOMB=["Dm","Dm","Bb","A"];

/* ---------- faixas ---------- */
function Track(kind,au){
  const c=au.ctx,out=c.createGain();out.gain.value=0;out.connect(M.bus);
  const t={kind,out,c,alive:true,step:0,next:c.currentTime+.15,I:0,born:c.currentTime};
  t.bpm=kind==="lobby"?72:kind==="plane"?112:kind==="zombie"?58:72;
  t.fade=(to,sec)=>{const n=c.currentTime;out.gain.cancelScheduledValues(n);out.gain.setValueAtTime(out.gain.value,n);out.gain.linearRampToValueAtTime(to,n+Math.max(.05,sec))};
  t.stop=sec=>{t.fade(0,sec);t.alive=false;setTimeout(()=>{try{out.disconnect()}catch(e){}},(sec+2.5)*1000)};
  return t;
}
function schedule(t,now){
  const c=t.c,beat=60/t.bpm,sd=beat/2;                      /* passo = colcheia */
  while(t.next<now+.7){
    const s=t.step,tm=t.next;
    barStep(t,s,tm,beat);
    t.step++;t.next+=sd;
  }
}
function barStep(t,s,tm,beat){
  const c=t.c,o=t.out,I=Math.min(1,Math.max(0,t.I)),sb=s%8,bar=Math.floor(s/8);
  if(t.kind==="lobby"){
    const ch=CH[PROG_LOBBY[bar%4]];
    if(sb===0){strings(c,o,tm,beat*4,ch.n,.07,1000,1.4);cello(c,o,tm,beat*4,ch.r,.12)}
    if(sb===0)timp(c,o,tm,ch.r+12,.34);
    if(sb===4&&bar%2===1)timp(c,o,tm,ch.r+12,.2);
    /* caixa militar discreta (marcha) */
    if(sb===2||sb===6)snare(c,o,tm,.07,true);
    if(sb===7&&bar%4===3){snare(c,o,tm,.1,true);snare(c,o,tm+beat*.25,.12,true)}
    if(bar%8===4&&sb===0)horn(c,o,tm,beat*6,ch.n[2]+12,.07,1100);      /* corne distante */
    if(bar%8===6&&sb===0)horn(c,o,tm,beat*3.5,ch.n[1]+12,.06,1000);
  }else if(t.kind==="plane"){
    const ch=CH[PROG_PLANE[bar%8]];
    if(sb===0){strings(c,o,tm,beat*4,[...ch.n,ch.n[0]+12],.05+.05*I,1100+1500*I,.5);cello(c,o,tm,beat*4,ch.r,.13+.05*I)}
    /* ostinato de cordas (entra com a energia) */
    if(I>.18){const n=[ch.n[0]+12,ch.n[2]+12,ch.n[1]+12,ch.n[2]+12][(s>>0)%4];if(sb%1===0)pluck(c,o,tm,n,.05+.05*I,.2,1800+1400*I)}
    /* tímpanos / taiko */
    if(sb===0||(I>.4&&sb===4))timp(c,o,tm,ch.r+12,.4+.3*I);
    if(I>.55&&(sb===3||sb===7))timp(c,o,tm,ch.r+19,.28);
    /* marcha de caixa */
    if(I>.3){if(sb===2||sb===6)snare(c,o,tm,.1+.08*I,false);else snare(c,o,tm,.04,true)}
    /* metais: fanfarra */
    if(I>.38&&sb===0&&bar%2===0){
      const fan=[[0,beat*2],[7,beat*2]];void fan;
      horn(c,o,tm,beat*3.4,ch.n[2]+12,.08+.07*I,1500+1000*I);
      horn(c,o,tm,beat*3.4,ch.n[0]+12,.07+.06*I,1400+900*I);
      if(I>.6)horn(c,o,tm+beat*2,beat*1.8,ch.n[3]+12,.09,2200);
    }
    if(I>.7&&sb===0&&bar%4===3)swell(c,o,tm,beat*3.6,.07+.06*I,3500);
    if(bar%8===7&&sb===6&&I>.5){for(let k=0;k<4;k++)snare(c,o,tm+k*beat*.25,.09+k*.02,true)}
  }else{                                                     /* zumbi: tensão sombria */
    const ch=CH[PROG_ZOMB[bar%4]];
    if(sb===0){drone(c,o,tm,beat*4,ch.r-12,.16+.06*I);drone(c,o,tm,beat*4,ch.r,.09,320)}
    if(sb===0||sb===2){timp(c,o,tm,ch.r+7,.22+.2*I)}      /* batimento cardíaco */
    if(sb===1&&I>.3)timp(c,o,tm,ch.r+7,.12+.12*I);
    if(sb===0&&bar%2===1)strings(c,o,tm,beat*4,[ch.n[0]+24,ch.n[0]+25],.018+.03*I,2600,1.8);   /* cordas dissonantes agudas */
    if(I>.35&&sb%2===0)snare(c,o,tm,.035+.06*I,true);
    if(I>.6&&sb===0&&bar%2===0)horn(c,o,tm,beat*2.6,ch.r+12,.1+.08*I,700);
    if(M.boss&&sb===0)horn(c,o,tm,beat*3.5,ch.r+12,.18,520);
    if(M.boss&&(sb===0||sb===3||sb===5))timp(c,o,tm,ch.r,.5);
    if(M.boss&&sb===6)swell(c,o,tm,beat*.8,.09,2400);
  }
}

/* ---------- controle ---------- */
function setKind(au,kind,fadeIn=2.2,fadeOut=2.2,gain=1){
  if(M.kind===kind&&M.cur&&M.cur.alive)return;
  if(M.cur&&M.cur.alive)M.cur.stop(fadeOut);
  M.kind=kind;
  if(!kind){M.cur=null;return}
  M.cur=Track(kind,au);M.cur.I=M.intensity;M.cur.fade(gain,fadeIn);
}
function loop(){
  const au=A();if(!au||!au.ctx||au.ctx.state!=="running"||!ensure(au))return;
  const g=window.__game,c=au.ctx;
  M.bus.gain.setTargetAtTime(volTarget(au),c.currentTime,.15);
  if(!g)return;
  const z=DKZ.on,p=g.player,st=g.state;
  let want=null;
  const m=p&&p.mode;
  if(m==="plane")M.landed=false;
  if(z){want=st==="playing"?"zombie":st==="loading"?M.kind:null}
  else if(st==="title"||st==="lobby"||st==="boot")want="lobby";
  else if(st==="loading")want=M.kind==="lobby"?"lobby":null;
  else if(st==="plane"||st==="playing"){
    if(m==="plane"||m==="freefall"||m==="chute"){if(!M.landed)want="plane"}
    else if(M.kind==="plane"){M.landed=true;want=null}
  }
  if(want!==M.kind){
    if(want==="plane"){setKind(au,"plane",.8,1.6,1)}
    else if(M.kind==="plane"&&!want){setKind(au,null,0,7.5)}                 /* pousou: fade-out gradual até o silêncio */
    else setKind(au,want,want==="zombie"?3:2.6,2.4,want==="lobby"?.9:1);
  }
  /* intensidade do voo: cresce ao longo da viagem do avião */
  if(M.kind==="plane"&&M.cur){
    const pl=g.plane;let prog=0;
    if(pl&&pl.active&&pl.duration)prog=Math.min(1,pl.t/pl.duration);
    else if(p&&p.mode!=="plane")prog=Math.min(1,.55+(M.cur?(c.currentTime-M.cur.born)/90:0));
    const I=.15+.85*Math.pow(prog,.8);M.cur.I=I;M.intensity=I;
    M.cur.out.gain.setTargetAtTime(.55+.45*I,c.currentTime,.8);
  }
  if(M.cur&&M.cur.alive)schedule(M.cur,c.currentTime);
}
M.timer=null;
M.start=function(){if(!M.timer)M.timer=setInterval(()=>{try{loop()}catch(e){}},90)};
M.zombieStart=function(){M.intensity=.2;M.boss=false};
M.zombieWave=function(i){M.intensity=.25+.18*i;if(M.cur&&M.kind==="zombie")M.cur.I=M.intensity};
M.zombieBoss=function(on){M.boss=!!on;M.intensity=on?1:.7;if(M.cur&&M.kind==="zombie")M.cur.I=M.intensity};
M.zombieTick=function(){};
M.zombieStop=function(){M.boss=false;M.intensity=0};
M.start();
try{window.__DKMusic=M}catch(e){}
return M;
})();

/* ===== DKLvl: níveis 1–100 (XP no servidor), LENDÁRIO, cinemática do avião ===== */
var DKLvl=(()=>{
const MAXL=100,TOTAL=6e6,LEG_SKIN=88;
const COST=(()=>{const raw=[];let sum=0;for(let n=1;n<MAXL;n++){const v=Math.pow(n,1.55)+9;raw.push(v);sum+=v}
  const c=raw.map(v=>Math.round(v*TOTAL/sum));c[c.length-1]+=TOTAL-c.reduce((a,b)=>a+b,0);return c})();
const CUM=[0];for(const c of COST)CUM.push(CUM[CUM.length-1]+c);
const levelOf=xp=>{let l=1;while(l<MAXL&&xp>=CUM[l])l++;return l};
const L={COST,CUM,levelOf,LEG:{shirt:0xc9a227,pants:0x14110a,skin:0xe3b88b,hair:0x14110a,accent:0xffe08a,pack:0x2f2610,helm:0x1c1608},
  p:{xp:0,lvl:1,base:0,next:COST[0],legend:0},last:null,SKIN:LEG_SKIN};
const GOLD="#e8c46a";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const G=()=>window.__game;

/* ---------- estado salvo (cópia local; o servidor é a fonte da verdade) ---------- */
L.load=function(){try{const c=jt.data.lvl;if(c&&typeof c.xp==="number")L.set(c,true)}catch(e){}};
L.set=function(m,quiet){
  const xp=Math.max(0,m.xp|0),lvl=levelOf(xp);
  L.p={xp,lvl,base:CUM[lvl-1],next:lvl>=MAXL?CUM[MAXL-1]:CUM[lvl],legend:m.legend?1:0};
  try{jt.data.lvl={xp,legend:L.p.legend};if(!quiet)jt.save()}catch(e){}
};
L.title=()=>L.p.legend?"LENDÁRIO":L.p.lvl>=75?"VETERANO DE GUERRA":L.p.lvl>=50?"SOLDADO EXPERIENTE":L.p.lvl>=25?"COMBATENTE":L.p.lvl>=10?"RECRUTA":"NOVATO";

/* ---------- skin / capa / efeitos dos LENDÁRIOS em partida ---------- */
const isLeg=a=>a&&a.skinIdx===LEG_SKIN;
L.addCape=function(a){
  if(a._cape||!a.rig||!a.rig.torso)return;
  const mk=(w,h,col)=>{const k=new Kt;k.box(0,-h/2,0,w,h,.035,col);return new wt(k.build(),oi())};
  const root=new me,segs=[];let par=root;
  for(let i=0;i<5;i++){const g=new me;g.position.y=i?-.26:0;const m=mk(.5-i*.03,.26,i%2?0x1a1408:0xc9a227);g.add(m);par.add(g);segs.push(g);par=g}
  root.position.set(0,.6,.3);a.rig.torso.add(root);
  a._cape={root,segs,ph:Math.random()*6};
};
L.matchStart=function(g){
  for(const a of g.actors)if(isLeg(a)){L.addCape(a);a._lgPrev=a.mode}
  const lg=g.actors.filter(isLeg);
  if(lg.length&&!DKZ.on){const nm=lg.map(a=>a.name).slice(0,2).join(" e ");setTimeout(()=>{try{g.hud.toast("⚜ LENDÁRIO NA PARTIDA: "+nm)}catch(e){}},1800)}
};
L.tick=function(g,dt){
  const t=performance.now()/1000;
  for(const a of g.actors){
    if(!isLeg(a)||!a.alive)continue;
    const c=a._cape;
    if(c){const sp=a.mode==="freefall"?1:a.mode==="chute"?.5:a.mode==="plane"?.95:Math.min(1,(a.spd||0)/6);
      for(let i=0;i<c.segs.length;i++)c.segs[i].rotation.x=-(.14+.5*(i+1)/5)*(.35+sp)+Math.sin(t*(5+sp*5)+i*.9+c.ph)*.11*(.3+sp)}
    /* entrada especial: trilha dourada em queda + explosão de luz ao saltar/pousar */
    const pm=a._lgPrev;
    if(pm!==a.mode){
      if((pm==="plane")&&(a.mode==="freefall")){try{g.effects.burst(a.pos.x,a.pos.y,a.pos.z,46,0xffd36a,13,1.3,2.4,0,.4,0,0,0);g.audio.play("legend",a.pos,.6)}catch(e){}}
      if(pm==="chute"&&a.mode==="ground"){try{g.effects.burst(a.pos.x,a.pos.y+.2,a.pos.z,40,0xffd36a,9,1.1,2.2,6,.8,0,1,0);g.effects.burst(a.pos.x,a.pos.y+.2,a.pos.z,20,0xffffff,5,.9,1.6,3,.9,0,1,0)}catch(e){}}
      a._lgPrev=a.mode;
    }
    if((a.mode==="freefall"||a.mode==="chute")){a._lgT=(a._lgT||0)-dt;if(a._lgT<=0){a._lgT=.05;try{g.effects.burst(a.pos.x,a.pos.y+1,a.pos.z,2,0xffd36a,1.4,1.1,1.5,-1,.1,0,0,0)}catch(e){}}}
  }
};

/* ---------- cinemática do nível 100 durante o voo ---------- */
const C={on:false,t:0,el:null};

L.cineFrame=function(g,dt){

N.reviveCand=function(){
  const g=this.g,p=g.player;
  if(!this.teamMode||!p||!p.alive||p.downed||p.mode!=="ground")return null;
  let best=null,bd=REVIVE_RANGE;
  for(const a of g.actors){
    if(a===p||!a.downed||!a.alive||a.team!==p.team||a.isBot)continue;
    const d=Math.hypot(a.pos.x-p.pos.x,a.pos.z-p.pos.z);
    if(d<bd&&Math.abs(a.pos.y-p.pos.y)<2.2){bd=d;best=a}

  try{a.rig.root.rotation.order="XYZ";a.rig.root.rotation.x=0}catch(e){}
  this.bcast({k:"rvd",id:a.id,by:by?by.id:-1});
  this.g.hud.feed((by?`<b>${N.nm(by)}</b> \u25B8 levantou \u25B8 `:"")+N.nm(a),"");
  if(a===this.g.player)this.say("Voc\u00EA foi levantado! "+REVIVE_HP+" de vida");
};
N.reviveTick=function(dt){
  const u=this.teamUI(),rv=this.rev;
  if(!rv){u.r.classList.add("hidden");return}
  if(this.reviveCand()!==rv.t||!rv.t.downed){this.rev=null;u.r.classList.add("hidden");return}
  rv.p+=dt/REVIVE_TIME;
  u.r.classList.remove("hidden");u.r.firstChild.textContent="Levantando "+rv.t.name+"\u2026";u.r.querySelector("i").style.width=Math.min(100,rv.p*100)+"%";
  if(rv.p>=1){
    this.rev=null;u.r.classList.add("hidden");this.sendTo(rv.t.net.owner,{k:"rv",to:rv.t.id,by:this.g.player.id});
    rv.t.downed=false;rv.t.hp=REVIVE_HP;
    this.say("Amigo levantado!");
  }
};
N.teamTick=function(dt){
  const g=this.g,p=g.player;
  for(const a of g.actors){
    if(!a.downed||!a.alive||a.isPuppet||!this.owned(a))continue;
    a.hp-=BLEED*dt;a.healT=-1;a.reloadT=-1;a.input.fire=false;
    const standing=g.actors.some(t=>t!==a&&t.team===a.team&&t.alive&&!t.downed&&!t.isBot);
    if(a.hp<=0||!standing){a.downed=false;a.hp=0;this.rawDie.call(a,a.downKiller||null,a.downWeapon)}
  }
  this.reviveTick(dt);
  this.hudT=(this.hudT||0)-dt;if(this.hudT<=0){this.hudT=.2;this.renderTeam()}
};
N.teamUI=function(){

  u.t.classList.toggle("hidden",!playing);

  const mem=g.actors.filter(a=>a.team===p.team).sort((a,b)=>(a===p?-1:b===p?1:a.id-b.id));
  const html=mem.map(a=>{
    const dead=!a.alive,dn=a.alive&&a.downed,hp=Math.max(0,Math.min(100,Math.round(a.hp)));
    const stt=dead?"ELIMINADO":dn?"DERRUBADO":hp;
    return`<div class="tm ${a===p?"me":""} ${dn?"dn":""} ${dead?"dead":""}"><div class="r"><span class="nm">${N.nmv(a.name,a.verified)}${a===p?' <small style="opacity:.7;font-weight:700">(voc\u00EA)</small>':""}</span><span class="st">${stt}</span></div><div class="dkbar"><i style="width:${dead?0:hp}%"></i></div></div>`;
  }).join("");

N.checkEnd=function(g,t){
  if(g.state!=="plane"&&g.state!=="playing")return true;
  const e=g.player,units=new Set();let mine=false;
  for(const a of g.actors)if(a.alive){units.add(a.team);if(a.team===e.team)mine=true}
  if(mine&&units.size<=1){g.deadT=0;g._winT=(g._winT||0)+t;if(g._winT>1.2){g._winT=0;g._finish(true)}return true}
  g._winT=0;
  if(mine){g.deadT=0;if(!e.alive)g._deadKiller=null;return true}

N.vfx=function(victim,killer){

  css();
  const p=victim.pos,fx={t:0,life:1.6,objs:[],parts:[]};
  const mat=(c,o)=>new de({color:c,transparent:true,opacity:o,side:_e,depthWrite:false,fog:false});
  const pillar=new wt(new je(.5,.5,36,16,1,true),mat(0x66e8ff,.85));pillar.position.set(p.x,p.y+18,p.z);
  const ring=new wt(new je(1,1,.25,40,1,true),mat(0xffe38a,.9));ring.position.set(p.x,p.y+.2,p.z);
  const ring2=new wt(new je(1,1,.25,40,1,true),mat(0x66e8ff,.8));ring2.position.set(p.x,p.y+.2,p.z);
  fx.pillar=pillar;fx.ring=ring;fx.ring2=ring2;fx.objs.push(pillar,ring,ring2);

    const m=new wt(new Vi(.22,0),new de({color:i%2?0x7fe9ff:0xffe38a,transparent:true,opacity:1,fog:false}));
    const a=Math.random()*6.283,s=2+Math.random()*3.5;

  }

  this.fx.push(fx);
  const near=Math.hypot(p.x-g.camera.position.x,p.z-g.camera.position.z)<90;
  if(near||killer===g.player){try{g.audio.play("win",null,.45)}catch(e){}}
  const b=$(`<div class="dkvk">\u{1F48E} ${N.nmv(killer.name,1)} abateu ${esc(victim===g.player?"você":victim.name)}</div>`);
  document.body.appendChild(b);setTimeout(()=>b.remove(),2500);
};
N.fxTick=function(dt){

    for(const q of f.parts){q.vy-=14*dt;q.m.position.x+=q.vx*dt;q.m.position.y+=q.vy*dt;q.m.position.z+=q.vz*dt;q.m.rotation.x+=dt*5;q.m.rotation.y+=dt*4;q.m.material.opacity=1-k;q.m.scale.setScalar(1-k*.6)}

/* ---------- PING / conexão (v8) ----------
   Mede o RTT com {t:"ping",n} -> {t:"pong",n} (o servidor já responde). Só roda em partida ONLINE.
   Cores: <60 verde · <120 lima · <200 amarelo · <350 laranja · <999 vermelho · 999+ vermelho piscando.
   Se ficar em 999+ (ou sem resposta/conexão caída) por 15 s seguidos, sai da partida sozinho. */
const PING_LIMIT=999,PING_KICK=15000,PING_SHOW=3000;

function renderPing(box,ms,eff){
  const big=ms>=PING_LIMIT,t=PT[ptier(big?1e12:ms)];
  box.style.setProperty("--pc",t[1]);
  box.classList.toggle("crit",big);
  box.innerHTML='<span class="pbars">'+[1,2,3,4].map(i=>'<i'+(i<=t[2]?' class="on"':'')+'></i>').join("")+'</span><span class="pv">'+(ms<0?"--":big?"999+":Math.round(ms))+'</span><small>ms</small>';
}
const nnode=()=>typeof DKNet!=="undefined"?DKNet:null;
const inMatch=N=>{const g=N&&N.g;return !!(N&&N.active&&g&&(g.state==="plane"||g.state==="playing"))};
function netReset(){NET.sent={};NET.raw=-1;NET.ms=-1;NET.badAt=0;NET.sendT=0;NET.key="";NET.wkey=""}
function netNodes(){return[document.querySelector("#hud .pingbox"),document.querySelector("#hud .netwarn")]}
function netIdle(){
  if(!NET.key&&!NET.wkey&&NET.raw<0&&!NET.badAt)return;
  const[b,w]=netNodes();if(b)b.classList.add("hidden");if(w)w.classList.add("hidden");netReset();
}
function pong(m){
  const t=m&&NET.sent[m.n];if(t==null)return;
  const r=performance.now()-t;NET.raw=r;NET.ms=NET.ms<0?r:NET.ms*.5+r*.5;
  for(const k in NET.sent)if(+k<=m.n)delete NET.sent[k];
}
function netTick(){
  const N=nnode(),now=performance.now(),gap=NET.tickT?now-NET.tickT:0;NET.tickT=now;
  if(!inMatch(N)){netIdle();return}
  if(gap>3000){NET.sent={};NET.badAt=0;NET.sendT=0}   // PC/aba suspensos: não conta como lag
  const open=!!(N.sock&&N.sock.readyState===1);
  if(open&&now-NET.sendT>=1000){NET.sendT=now;const n=++NET.n;NET.sent[n]=now;N.send({t:"ping",n})}
  let age=0;for(const k in NET.sent){const a=now-NET.sent[k];if(a>age)age=a;if(a>30000)delete NET.sent[k]}
  let eff=Math.max(NET.raw<0?0:NET.raw,age);if(!open)eff=1e12;
  const shown=eff>=PING_LIMIT?1e12:NET.raw<0&&age<400?-1:Math.max(NET.ms,age);
  if(eff>=PING_LIMIT){if(!NET.badAt)NET.badAt=now}else NET.badAt=0;
  const bad=NET.badAt?now-NET.badAt:0,[b,w]=netNodes();
  if(b){
    const k=shown>=PING_LIMIT?"x":shown<0?"-":String(Math.round(shown));
    if(k!==NET.key||b.classList.contains("hidden")){NET.key=k;renderPing(b,shown,eff);b.classList.remove("hidden")}
  }
  if(w){
    if(bad>=PING_SHOW){
      const s=Math.max(1,Math.ceil((PING_KICK-bad)/1000)),k=String(s);
      if(k!==NET.wkey||w.classList.contains("hidden")){NET.wkey=k;w.innerHTML=(open?"CONEXÃO INSTÁVEL":"CONEXÃO PERDIDA")+"<small>Saindo da partida em <b>"+s+"</b> s se não melhorar</small>";w.classList.remove("hidden")}
    }else if(NET.wkey){NET.wkey="";w.classList.add("hidden")}
  }
  if(bad>=PING_KICK)netLeave(N);
}
function netNotice(t,s){
  let d=document.getElementById("netNotice");
  if(!d){

    d.innerHTML='<div class="nn-card"><div class="nn-ic">!</div><h3></h3><p></p><button class="btn small">OK</button></div>';

/* =====================================================================
   DKGren (v9) — sistema de granadas
   - física própria (gravidade, arrasto, quique em paredes/chão/telhados, rolagem em rampas)
   - jogador: segurar = preparar (mostra trajetória), soltar = lançar; potência cresce com o tempo segurando
   - explosão: dano proporcional à distância, cobertura reduz, auto-dano reduzido, sem fogo amigo em times
   - multiplayer: o DONO do arremesso manda {k:"gr"} (lançamento) e {k:"gx"} (explosão);
     cada cliente simula o visual, mas só o cliente dono aplica dano (puppets repassam via "dm", como os tiros)
   - bots: solver balístico + verificação de aliados (usado pela IA)
   ===================================================================== */
var DKGren=(()=>{
const G=16,RAD=.1,BLAST=8.5,DMG=260,FUSE=3.2,REST=.42,SPD0=7,SPD1=21,UPA=.22,CHARGE=1.1,MAXN=14;
const S={list:[],n:1,grp:null,scene:null,geo:null,mat:null,sph:null,flashM:null,waveM:null,fx:[],dots:[],ring:null,dot:null,ringM:null,aimOn:!1};

function geom(){return vs("gren",()=>{const r=new Kt;r.octa(0,.1,0,.1,.12,.1,5934394,.02);r.cyl(0,.205,0,.035,.035,.05,6,3355443);r.cyl(0,.235,0,.055,.055,.014,6,16766000);return r.build()})}
S.geoFn=geom;
function ensure(g){
  if(!S.sph){S.sph=new us(1,12,10);S.mat=new Re({vertexColors:!0});
    S.flashM=new de({color:16765568,transparent:!0,opacity:.9,depthWrite:!1});
    S.waveM=new de({color:16743962,transparent:!0,opacity:.3,depthWrite:!1,side:2});
    S.dotM=new de({color:6291283,transparent:!0,opacity:.9,depthWrite:!1});
    S.ringM=new de({color:16755005,transparent:!0,opacity:.35,depthWrite:!1,side:2});
    S.ringG=new cs(.92,1,40);S.ringG.rotateX(-Math.PI/2)}
  if(S.scene!==g.scene){
    S.scene=g.scene;S.grp=new me;g.scene.add(S.grp);S.fx=[];S.dots=[];S.ring=null;S.dot=null;
    for(let i=0;i<MAXN*2+2;i++){const m=new wt(S.sph,S.dotM);m.scale.setScalar(.075);m.visible=!1;m.frustumCulled=!1;S.grp.add(m);S.dots.push(m)}
    S.ring=new wt(S.ringG,S.ringM);S.ring.visible=!1;S.ring.frustumCulled=!1;S.grp.add(S.ring);
  }
}
const nrm=(c,v)=>c.hit.kind==="terrain"?null:[c.hit.nx,c.hit.ny,c.hit.nz];

/* ---------- física (compartilhada pela prévia, grenade real e solver dos bots) ---------- */
function stepPhys(g,s,h){
  if(s.rest)return 0;
  const col=g.world.collision,T=g.world.terrain;
  s.vy-=G*h;const dr=Math.exp(-.1*h);s.vx*=dr;s.vz*=dr;
  let dx=s.vx*h,dy=s.vy*h,dz=s.vz*h,L=Math.hypot(dx,dy,dz),ev=0,hitN=null;
  if(L>1e-6){
    const ux=dx/L,uy=dy/L,uz=dz/L,d=col.rayWorld(s.x,s.y,s.z,ux,uy,uz,L+RAD,null);
    if(col.hit.kind!==""&&d<=L+RAD){
      let nx=col.hit.nx,ny=col.hit.ny,nz=col.hit.nz;
      if(col.hit.kind==="terrain"){const e=.6,gx=(T.h(s.x+e,s.z)-T.h(s.x-e,s.z))/(2*e),gz=(T.h(s.x,s.z+e)-T.h(s.x,s.z-e))/(2*e),q=Math.hypot(gx,1,gz);nx=-gx/q;ny=1/q;nz=-gz/q}

        ev=-vn;s.bn=(s.bn||0)+1;hitN=ny;
      }

  }
  // piso (chão, andares, telhados): evita atravessar superfícies finas
  const fl=col.groundAt(s.x,s.z,s.y+.3,.4);
  if(s.y<fl+RAD&&s.vy<=0&&s.y>fl-.9){

    s.vx=s.vx*Math.exp(-3*h)-gx*G*h*.5;s.vz=s.vz*Math.exp(-3*h)-gz*G*h*.5;hitN=1;

}
/* simula a trajetória; devolve pontos (a cada `every` s) e posição final no tempo `T` */
function simulate(g,x,y,z,vx,vy,vz,T,every,out){

  if(out)out.length=0;
  while(t<T){stepPhys(g,s,h);t+=h;if(out&&t>=nx){out.push([s.x,s.y,s.z]);nx+=every}if(s.rest&&!out)break}

/* ---------- arremesso ---------- */
function launchVel(o,power,vx0,vz0){
  const r=o.aimRay?o.aimRay():o.game.camCtl.aimRay(o),hl=Math.hypot(r.dx,r.dz)||1,p=Math.asin(st(r.dy,-1,1))+UPA,sp=SPD0+(SPD1-SPD0)*power,c=Math.cos(p);
  return{ox:o.pos.x+r.dx/hl*.45,oy:o.eyeY-.3,oz:o.pos.z+r.dz/hl*.45,vx:r.dx/hl*c*sp+(vx0||0),vy:Math.sin(p)*sp,vz:r.dz/hl*c*sp+(vz0||0)};
}
function spawn(g,own,x,y,z,vx,vy,vz,fuse,gid,auth){
  ensure(g);
  const m=new wt(geom(),S.mat);m.frustumCulled=!1;S.grp.add(m);
  const o={id:gid,own,x,y,z,vx,vy,vz,fuse,auth,rest:!1,bn:0,mesh:m,t:0,rx:Math.random()*6,ry:Math.random()*6,spin:6+Math.random()*4,warn:0};
  m.position.set(x,y,z);S.list.push(o);return o;
}
const isAuth=(o)=>{const N=DKNet;return!N.active||N.owned(o)};
function throwNow(g,o,power,pre){
  if(!o.alive||o.inv.grenades<=0)return null;
  const hv=pre||launchVel(o,power,o.vel.x*.5,o.vel.z*.5);
  // não deixa nascer dentro de parede: se o caminho até a mão bate, nasce no olho
  const c=g.world.collision;let ox=hv.ox,oy=hv.oy,oz=hv.oz;
  const dx=ox-o.pos.x,dy=oy-o.eyeY,dz=oz-o.pos.z,L=Math.hypot(dx,dy,dz)||1;
  c.rayWorld(o.pos.x,o.eyeY,o.pos.z,dx/L,dy/L,dz/L,L,null);if(c.hit.kind!==""){ox=o.pos.x;oy=o.eyeY-.1;oz=o.pos.z}
  o.inv.grenades--;o.gCd=.9;o.gprep=0;
  const gid=o.id*10000+(S.n++%10000);
  spawn(g,o,ox,oy,oz,hv.vx,hv.vy,hv.vz,FUSE,gid,isAuth(o));
  try{o.rig.startThrow();o.rig.throwT=.17}catch(e){}
  g.audio.play("gren_throw",o.pos,.7,o);g.emitSound(o.pos.x,o.pos.z,22,o,"prisma");
  if(DKNet.active&&DKNet.owned(o))DKNet.bcast({k:"gr",id:gid,o:o.id,p:[+ox.toFixed(2),+oy.toFixed(2),+oz.toFixed(2)],v:[+hv.vx.toFixed(2),+hv.vy.toFixed(2),+hv.vz.toFixed(2)],f:FUSE});
  return gid;
}

/* ---------- explosão ---------- */
function boomFx(g,x,y,z,own){
